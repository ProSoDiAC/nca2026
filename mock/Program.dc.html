<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NCA 2026 Program</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F7F8; color: #0A2540; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

<div style="padding: 28px 20px 12px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 28px">Program</h1>
<div style="font-size: 13.5px; color: #4A5B6B">Siracusa Urban Center · Nov 2026</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="4">
<button onClick="{{ d.pick }}" aria-pressed="{{ d.selected }}" style="min-height: 64px; border: 0; border-radius: 14px; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0">
<span style="font-size: 12px; font-weight: 500">{{d.dow}}</span>
<span style="font-family: 'Sora', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">{{d.date}}</span>
</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E1E8EC">
<sc-for list="{{rooms}}" as="r" hint-placeholder-count="2">
<button onClick="{{ r.pick }}" aria-pressed="{{ r.selected }}" style="min-height: 44px; border: 0; border-radius: 11px; background: {{r.bg}}; color: {{r.fg}}; font-size: 14px; font-weight: 600; padding: 0">{{r.label}}</button>
</sc-for>
</div>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<div style="display: flex; gap: 12px; align-items: flex-start">
<div style="width: 44px; flex: none; display: flex; flex-direction: column; gap: 2px; padding-top: 2px">
<span style="font-size: 14px; font-weight: 600">{{it.time}}</span>
<span style="font-size: 12px; color: #546574">{{it.end}}</span>
</div>
<sc-if value="{{ it.isBreak }}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 32px; display: flex; align-items: center; font-size: 13.5px; color: #3B4D5E; border-bottom: 1px dashed #BFCBD3; padding-bottom: 6px">{{it.title}}</div>
</sc-if>
<sc-if value="{{ it.isCard }}" hint-placeholder-val="{{ true }}">
<a href="Sessions.dc.html" style="flex: 1; min-width: 0; box-sizing: border-box; padding: 14px; border-radius: 16px; background: {{it.bg}}; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="padding: 4px 10px; border-radius: 999px; background: {{it.tagBg}}; color: {{it.tagFg}}; font-size: 12px; font-weight: 600">{{it.tag}}</span>
<span style="font-size: 12px; font-weight: 500; color: #3B4D5E">{{it.where}}</span>
</div>
<div style="font-family: 'Sora', sans-serif; font-weight: 600; font-size: 15px; line-height: 1.3">{{it.title}}</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: #3B4D5E">
<span>{{it.who}}</span>
<span style="display: flex; align-items: center; gap: 4px; font-weight: 600; color: #0A5E66">{{it.more}}
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</span>
</div>
</a>
</sc-if>
</div>
</sc-for>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DCE4E8; padding-bottom: 8px">
<a href="Main.dc.html" style="min-height: 56px; box-sizing: border-box; border-top: 3px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #546574">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
Home
</a>
<a href="Program.dc.html" style="min-height: 56px; box-sizing: border-box; border-top: 3px solid #0E7C86; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: #0A2540">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
Program
</a>
<a href="News.dc.html" style="min-height: 56px; box-sizing: border-box; border-top: 3px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #546574">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
News
</a>
<a href="Sessions.dc.html" style="min-height: 56px; box-sizing: border-box; border-top: 3px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #546574">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.8 0 5 2.2 5 5"/></svg>
Sessions
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const day = st.day || 10;
const room = st.room || 'A';
const dows = { 10: 'Tue', 11: 'Wed', 12: 'Thu', 13: 'Fri' };
const days = [10, 11, 12, 13].map((d) => ({
dow: dows[d],
date: String(d),
selected: d === day,
bg: d === day ? '#0A2540' : '#FFFFFF',
fg: d === day ? '#FFFFFF' : '#0A2540',
pick: () => this.setState({ day: d })
}));
const rooms = ['A', 'B'].map((r) => ({
label: 'Sala ' + r,
selected: r === room,
bg: r === room ? '#FFFFFF' : 'transparent',
fg: r === room ? '#0A2540' : '#3B4D5E',
pick: () => this.setState({ room: r })
}));
const slots = [['09:00', '10:30'], ['11:00', '12:30'], ['14:00', '15:30'], ['16:00', '17:30']];
const base = (day - 10) * 4;
const items = [];
items.push({ isBreak: true, isCard: false, time: '08:30', end: '', title: 'Registration & welcome coffee' });
slots.forEach((s, i) => {
const keynote = i === 0 && room === 'A';
items.push({
isBreak: false,
isCard: true,
time: s[0],
end: s[1],
bg: keynote ? '#FBEBCF' : '#FFFFFF',
tag: keynote ? 'Keynote' : room + String(base + i + 1),
tagBg: keynote ? '#0A2540' : '#DDF0F2',
tagFg: keynote ? '#FFFFFF' : '#0A5E66',
where: 'Sala ' + room,
title: keynote ? '[Keynote title]' : '[Session title]',
who: keynote ? '[Speaker name]' : 'Chair · [Chair name]',
more: keynote ? 'Details' : '4 papers'
});
if (i === 0) items.push({ isBreak: true, isCard: false, time: '10:30', end: '', title: 'Coffee break' });
if (i === 1) items.push({ isBreak: true, isCard: false, time: '12:30', end: '', title: 'Lunch' });
if (i === 2) items.push({ isBreak: true, isCard: false, time: '15:30', end: '', title: 'Coffee break' });
});
if (day === 13) {
items.push({ isBreak: false, isCard: true, time: '17:30', end: '18:00', bg: '#FBEBCF', tag: 'Plenary', tagBg: '#0A2540', tagFg: '#FFFFFF', where: 'Sala A', title: 'Closing & best paper awards', who: '[Chairs]', more: 'Details' });
}
return { days, rooms, items };
}
}
</script>
</body>
</html>
